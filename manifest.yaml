applications:
  - name: cdc-places-mcp-server
    buildpacks:
        - python_buildpack
    command: PYTHONPATH=src python -m places.app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: cdc-places-mcp-server.app.cloud.gov
    disk_quota: 512M
    memory: 250M