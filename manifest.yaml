applications:
  - name: mcp-cdc-places
    buildpacks:
        - python_buildpack
    command: PYTHONPATH=src python -m places.app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: mcp-cdc-places.apps.internal
    disk_quota: 1G
    memory: 125M
